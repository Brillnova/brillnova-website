<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BN-USV carrier board set concept illustration</title>
  <desc id="desc">Illustration of a Main Carrier Board and two matching Sub Carrier Boards connected by CAN.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071822"/><stop offset="1" stop-color="#123647"/></linearGradient>
    <linearGradient id="main" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b756c"/><stop offset="1" stop-color="#16474a"/></linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e6190"/><stop offset="1" stop-color="#123b62"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6fc7d0" stroke-opacity=".10"/></pattern>
    <style>
